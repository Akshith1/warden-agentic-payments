# Layer: the application. The backend expects postgres (base) and litellm (model) on warden-net.
networks:
  default:
    name: warden-net
    external: true
  # Phase 5: the OCR sandbox's only network. internal: no route to the internet,
  # and nothing on it but the OCR service and the backend.
  ocr:
    name: warden-ocr
    internal: true
  # Phase 7: the PII service's only network; no route to the internet.
  pii:
    name: warden-pii
    internal: true

volumes:
  control-data:

services:
  warden-ledger:
    build: ./warden-ledger
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      PGPASS_WARDEN_LEDGER: ${PGPASS_WARDEN_LEDGER:?set in .env}
      LEDGER_WRITE_KEY: ${LEDGER_WRITE_KEY:?set in .env}
      VENDOR_LOOKUP_KEY: ${VENDOR_LOOKUP_KEY:?set in .env}
      OPENING_CASH: ${OPENING_CASH:-250000.00}
    ports:
      - "127.0.0.1:8101:8000"
    deploy:
      resources:
        limits:
          memory: 512m

  # Phase 9: the kill switch and the hash-chained audit log. The volume is handed to the
  # service's user first (the same lesson as Keycloak's volume in phase 6).
  control-data-init:
    image: alpine:3.22
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - control-data:/data
      - ./infra/litellm/agents.yaml:/etc/warden/agents.yaml:ro
    restart: "no"

  warden-control:
    build: ./warden-control
    restart: unless-stopped
    depends_on:
      control-data-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      CONTROL_DB: /data/control.db
      KEYCLOAK_ISSUER: http://localhost:8180/realms/warden
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/warden/protocol/openid-connect/certs
      CANARY_VENDORS: ${CANARY_VENDORS:-CANARY-DO-NOT-PAY}
    volumes:
      - control-data:/data
      - ./infra/litellm/agents.yaml:/etc/warden/agents.yaml:ro
    ports:
      - "127.0.0.1:8103:8000"
    deploy:
      resources:
        limits:
          memory: 256m

  warden-policy:
    build: ./warden-policy
    restart: unless-stopped
    depends_on:
      warden-ledger:
        condition: service_healthy
      warden-control:
        condition: service_healthy
    environment:
      POLICY_DIR: /policies
      CONTROL_URL: http://warden-control:8000
      LEDGER_URL: http://warden-ledger:8000
      # Read-only: the policy service looks up vendor history itself.
      VENDOR_LOOKUP_KEY: ${VENDOR_LOOKUP_KEY:?set in .env}
    volumes:
      # Validated at startup; a rejected set stops the service (and with it, payments).
      - ./policies:/policies:ro
      # Copies of the policies to try out changes (scenario 07); gitignored, never served.
      - ./.scratch:/scratch:ro
    ports:
      - "127.0.0.1:8102:8000"
    deploy:
      resources:
        limits:
          memory: 256m

  warden-ocr:
    build: ./warden-ocr
    restart: unless-stopped
    networks: [ocr]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /work:size=64m,uid=10001,gid=10001,mode=0700
      - /tmp:size=16m,uid=10001,gid=10001,mode=0700
    environment:
      OCR_WORK_DIR: /work
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.0"
          pids: 64

  # Phase 7: masks personal data before any model reads an invoice. Stateless, no internet.
  warden-pii:
    build: ./warden-pii
    restart: unless-stopped
    networks: [pii]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=0700
    deploy:
      resources:
        limits:
          memory: 1g

  # Phase 7b: Great Expectations checks on the ledger, vendor history and loaded data.
  # Reads through a role that can only SELECT; stops payments only through the control plane.
  # No published port: the console reaches it on the Docker network.
  warden-quality:
    build: ./warden-quality
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=0700
    depends_on:
      postgres:
        condition: service_healthy
      warden-control:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      PGPASS_WARDEN_QUALITY: ${PGPASS_WARDEN_QUALITY:?add PGPASS_WARDEN_QUALITY to .env (phase 7b)}
      CONTROL_URL: http://warden-control:8000
      QUALITY_INTERVAL_MINUTES: ${QUALITY_INTERVAL_MINUTES:-10}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/warden
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/warden/protocol/openid-connect/certs
    deploy:
      resources:
        limits:
          memory: 768m

  warden-backend:
    build: ./warden-backend
    restart: unless-stopped
    networks: [default, ocr, pii]   # the only service on the internal networks
    depends_on:
      warden-ledger:
        condition: service_healthy
      warden-policy:
        condition: service_healthy
      warden-ocr:
        condition: service_healthy
      warden-pii:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      litellm:
        condition: service_healthy
      # Start after MLflow so the promoted prompt is found; not required, because the
      # backend falls back to its bundled prompt when MLflow is absent.
      mlflow:
        condition: service_healthy
        required: false
    environment:
      POSTGRES_HOST: postgres
      PGPASS_WARDEN_BACKEND: ${PGPASS_WARDEN_BACKEND:?set in .env}
      LITELLM_URL: http://litellm:4000
      # Phase 8: each agent calls with its own key from the agent-keys volume; no master key here.
      AGENT_KEYS_FILE: /run/agent-keys/agent-keys.json
      LEDGER_URL: http://warden-ledger:8000
      POLICY_URL: http://warden-policy:8000
      OCR_URL: http://warden-ocr:8000
      PII_URL: http://warden-pii:8000
      CONTROL_URL: http://warden-control:8000
      KEYCLOAK_ISSUER: http://localhost:8180/realms/warden
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/warden/protocol/openid-connect/certs
      LEDGER_WRITE_KEY: ${LEDGER_WRITE_KEY:?set in .env}
      VENDOR_LOOKUP_KEY: ${VENDOR_LOOKUP_KEY:?set in .env}
      ROUTINE_AMOUNT_THRESHOLD: ${ROUTINE_AMOUNT_THRESHOLD:-5000}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.75}
      SETTLEMENT_HOLD_SECONDS: ${SETTLEMENT_HOLD_SECONDS:-20}
      LEDGER_CURRENCY: ${LEDGER_CURRENCY:-MYR}
      MIN_PRIOR_PAYMENTS: ${MIN_PRIOR_PAYMENTS:-2}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - agent-keys:/run/agent-keys:ro
    ports:
      - "127.0.0.1:8100:8000"
    deploy:
      resources:
        limits:
          memory: 1g

  warden-console:
    build: ./warden-console
    restart: unless-stopped
    depends_on:
      warden-backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://warden-backend:8000
      LEDGER_URL: http://warden-ledger:8000
      # Browsers are sent to Keycloak at localhost:8180; this server exchanges codes and
      # fetches keys at keycloak:8080. Both must match infra/keycloak/realm-warden.json.
      CONTROL_URL: http://warden-control:8000
      QUALITY_URL: http://warden-quality:8000
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      CONSOLE_URL: http://localhost:3100
      # Read-only ledger key, used by the console's server only; the browser never sees it.
      VENDOR_LOOKUP_KEY: ${VENDOR_LOOKUP_KEY:?set in .env}
    ports:
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          memory: 512m
