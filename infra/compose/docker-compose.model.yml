# Layer: model governance. Phase 2 adds MLflow and the DeepEval gate; phase 8 adds per-agent keys.
networks:
  default:
    name: warden-net
    external: true

services:
  litellm:
    build: ./infra/litellm
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?add your OpenAI key to .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?add your Groq key to .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          memory: 1g
