# Layer: identity (phase 6). Keycloak signs people in to the console and issues
# the tokens the backend checks. The realm in infra/keycloak/realm-warden.json is
# imported on first start: roles submitter, approver and controller; users rajesh,
# clerk and amira with temporary passwords that must be changed at first sign-in.
networks:
  default:
    name: warden-net
    external: true

volumes:
  keycloak-data:

services:
  # A new Docker volume belongs to root; Keycloak runs as uid 1000 and must write its
  # database and temporary files there. This one-off step hands the folder over first.
  keycloak-data-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/h2 /data/tmp && chown -R 1000:0 /data && chmod -R g+rwX /data"]
    volumes:
      - keycloak-data:/data
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    restart: unless-stopped
    depends_on:
      keycloak-data-init:
        condition: service_completed_successfully
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?add KEYCLOAK_ADMIN_PASSWORD to .env (phase 6)}
      # Browsers reach Keycloak at localhost:8180; services at keycloak:8080. Tokens always
      # name http://localhost:8180/realms/warden as issuer, which is what the backend checks.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-warden.json:/opt/keycloak/data/import/realm-warden.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
