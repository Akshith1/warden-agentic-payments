# SPIRE server (phase 6b): the trust domain's authority. Issues identities only to workloads its
# agent has checked, and only the ones listed in identities.json. Option names checked against
# SPIRE 1.15.5's doc/spire_server.md.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/run/spire/server/api.sock"
    trust_domain = "warden.local"
    data_dir = "/opt/spire/data/server"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
    # Identity tokens for the ledger live five minutes; callers renew a minute before expiry.
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }
    # The agent joins once with a one-time token from the bootstrap job, then keeps its own identity.
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}
