# SPIRE agent (phase 6b): runs beside the workloads, works out which container is asking, and
# hands it the identity the server lists for that container. Option names checked against
# SPIRE 1.15.5's doc/spire_agent.md and doc/plugin_agent_workloadattestor_docker.md.
agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "warden.local"
    # Both written by spire-bootstrap: the server's CA bundle, and a one-time join token.
    trust_bundle_path = "/run/spire/bootstrap/bundle.pem"
    join_token_file = "/run/spire/bootstrap/join_token"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire/data/agent"
        }
    }
    # Which container is calling: the caller's process -> its container (cgroups) -> its labels, read
    # from the Docker API. Compose labels every container with its service name, and identities.json
    # matches on that. Verbose logs show each lookup, for the first runs on a new machine.
    WorkloadAttestor "docker" {
        plugin_data {
            verbose_container_locator_logs = true
        }
    }
}
